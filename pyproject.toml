[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-contribution-pilot"
version = "0.1.0"
description = "Discover open-source issues and coordinate reviewed contributions"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
oss-pilot = "oss_pilot.cli:main"

[tool.setuptools]
packages = ["oss_pilot"]
